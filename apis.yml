name: Salto
description: >-
  Salto is an AI-powered configuration-management platform for enterprise business and IT
  applications. It lets teams search, analyze, compare, document, and deploy configuration
  changes across systems such as Salesforce, Salesforce CPQ, NetSuite, Zendesk, Jira,
  Confluence, Google Workspace, Okta, Microsoft Entra ID, Jamf, Cloudflare and CrowdStrike —
  treating application configuration as version-controlled NACL code with Git-based CI/CD,
  environment synchronization, automated backup and restore, dependency and impact analysis,
  and AI agents (including Claude Code and OpenAI Codex integrations) that implement and
  validate changes with full instance context. Salto publishes open-source adapters, a VS Code
  extension and monitoring tooling on npm rather than a public REST API; the product is used
  through its web app, CLI/NACL tooling, and a Slack-accessible AI agent.
